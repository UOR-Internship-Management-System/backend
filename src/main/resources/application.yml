spring:
  application:
    name: cv-management-backend
  profiles:
    default: local
  jackson:
    time-zone: UTC
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

app:
  auth:
    otp:
      length: ${APP_AUTH_OTP_LENGTH:6}
      ttl: ${APP_AUTH_OTP_TTL:PT5M}
      max-attempts: ${APP_AUTH_OTP_MAX_ATTEMPTS:3}
      resend-cooldown: ${APP_AUTH_OTP_RESEND_COOLDOWN:PT60S}
      max-resends: ${APP_AUTH_OTP_MAX_RESENDS:3}
  security:
    jwt:
      issuer: ${JWT_ISSUER:cv-management}
      secret: ${JWT_SECRET:change-this-local-development-secret-at-least-32-characters}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
    cors:
      allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    root: INFO
    lk.ac.ruhuna.dcs.cvmanagement: INFO
