spring:
  datasource:
    url: jdbc:postgresql://${CV_DB_HOST:localhost}:${CV_DB_PORT:5432}/${CV_DB_NAME:cv_management}
    username: ${CV_DB_USERNAME:cv_user}
    password: ${CV_DB_PASSWORD:cv_local_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
