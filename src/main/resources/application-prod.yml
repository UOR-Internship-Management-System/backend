spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      secret: ${JWT_SECRET}
    cors:
      allowed-origins: ${FRONTEND_ORIGIN}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    lk.ac.ruhuna.dcs.cvmanagement: INFO
