spring:
  datasource:
    url: jdbc:h2:mem:cv_management_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: false

app:
  security:
    jwt:
      issuer: cv-management-test
      secret: test-only-secret-change-in-real-environments
      access-token-ttl: PT30M
      refresh-token-ttl: P7D
    cors:
      allowed-origins: http://localhost:5173
